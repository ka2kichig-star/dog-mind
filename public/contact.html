<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ 🐾 | わんにゃん翻訳機</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #f4a261;
      --primary-dark: #e07020;
      --bg-base: #fefcf9;
      --text-main: #4a3f35;
      --text-sub: #7a6e65;
      --white: #ffffff;
      --purple: #7c5cbf;
      --purple-light: #faf4ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Zen Maru Gothic', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      line-height: 1.7;
      padding: 40px 16px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: var(--white);
      padding: 30px 24px;
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.03);
      border: 2px solid #e1bee7;
    }

    h1 {
      font-size: 22px;
      font-weight: 900;
      text-align: center;
      margin-bottom: 20px;
      color: var(--purple);
      border-bottom: 3px solid var(--purple);
      padding-bottom: 10px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 2px solid #e0e0e0;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }

    .form-input:focus {
      border-color: var(--purple);
    }

    textarea.form-input {
      height: 140px;
      resize: none;
    }

    .btn {
      width: 100%;
      padding: 14px 24px;
      border-radius: 28px;
      border: none;
      background: var(--purple);
      color: white;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
      margin-top: 10px;
    }

    .btn:hover:not(:disabled) {
      background: #5b3f7e;
      transform: translateY(-1px);
    }

    .btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    /* ===== Footer ===== */
    footer {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #e1bee7;
      text-align: center;
      font-size: 11px;
      color: var(--text-sub);
    }

    footer a {
      color: var(--purple);
      text-decoration: underline;
      margin: 0 10px;
    }

    /* Message state */
    .loading-state, .success-state {
      text-align: center;
      padding: 30px 10px;
    }

    .state-emoji {
      font-size: 50px;
      margin-bottom: 16px;
    }

    .state-title {
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 10px;
      color: #2d2d2d;
    }

    .state-desc {
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 20px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(0, 0, 0, 0.1);
      border-left-color: var(--purple);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>お問い合わせ</h1>

    <!-- 1. 送信中表示 -->
    <div id="state-loading" class="loading-state" style="display: none;">
      <div class="spinner"></div>
      <div class="state-title">送信中...</div>
      <p class="state-desc">お問い合わせ内容を送信しています🐾</p>
    </div>

    <!-- 2. 送信完了表示 -->
    <div id="state-success" class="success-state" style="display: none;">
      <div class="state-emoji">✉️</div>
      <div class="state-title">送信が完了しました</div>
      <p class="state-desc">
        お問い合わせを受け付けました。ご入力いただいたメールアドレス宛に、追って管理者よりご連絡いたします。お時間をいただく場合がございますが、しばらくお待ちください🐾
      </p>
      <a href="/" class="btn" style="text-decoration:none; display:inline-block;">アプリへ戻る</a>
    </div>

    <!-- 3. お問い合わせフォーム -->
    <div id="state-form">
      <form id="contact-form" onsubmit="submitContact(event)">
        <div class="form-group">
          <label for="contact-name">お名前</label>
          <input type="text" id="contact-name" class="form-input" required placeholder="山田 太郎">
        </div>

        <div class="form-group">
          <label for="contact-email">メールアドレス</label>
          <input type="email" id="contact-email" class="form-input" required placeholder="your@email.com">
        </div>

        <div class="form-group">
          <label for="contact-subject">件名</label>
          <input type="text" id="contact-subject" class="form-input" required placeholder="例：月額プランの機能について、など">
        </div>

        <div class="form-group">
          <label for="contact-content">お問い合わせ内容</label>
          <textarea id="contact-content" class="form-input" required placeholder="お問い合わせ内容をご入力ください..."></textarea>
        </div>

        <button type="submit" id="submit-btn" class="btn">送信する</button>
      </form>
    </div>

    <footer>
      <div style="margin-bottom: 8px;">
        <a href="terms.html">利用規約</a>
        <a href="privacy.html">プライバシーポリシー</a>
        <a href="cancel.html">解約はこちら</a>
        <a href="contact.html">お問い合わせ</a>
      </div>
      <p>&copy; 2026 わんにゃん翻訳機 🐾 Powered by Claude AI</p>
    </footer>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
    import { getFirestore, collection, addDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyBio-wwXDiPKYQ5mPiqE98bwakOKl1UPvo",
      authDomain: "wanwan-translator.firebaseapp.com",
      projectId: "wanwan-translator",
      storageBucket: "wanwan-translator.firebasestorage.app",
      messagingSenderId: "1060567209218",
      appId: "1:1060567209218:web:2c2298458b8e378b119e1b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // UI elements
    const stateLoading = document.getElementById('state-loading');
    const stateSuccess = document.getElementById('state-success');
    const stateForm = document.getElementById('state-form');

    // Submitting contact to firestore
    window.submitContact = async (event) => {
      event.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.textContent = '送信中...';
      
      stateForm.style.display = 'none';
      stateLoading.style.display = 'block';

      const name = document.getElementById('contact-name').value.trim();
      const email = document.getElementById('contact-email').value.trim();
      const subject = document.getElementById('contact-subject').value.trim();
      const content = document.getElementById('contact-content').value.trim();

      try {
        await addDoc(collection(db, 'contacts'), {
          name,
          email,
          subject,
          content,
          isRead: false,
          createdAt: serverTimestamp()
        });

        stateLoading.style.display = 'none';
        stateSuccess.style.display = 'block';
      } catch (e) {
        console.error('Contact submit error:', e);
        alert('送信に失敗しました。時間をおいて再度お試しください。\n詳細: ' + e.message);
        stateLoading.style.display = 'none';
        stateForm.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = '送信する';
      }
    };
  </script>
</body>
</html>
